<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Into the Woods</title>
<meta name="description" content="Walk an endless pixel-art forest: winding trails, birch and pine groves, sun shafts, and mushrooms, berries and herbs to forage.">
<style>
  html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    opacity: 0; transition: opacity 900ms ease; cursor: crosshair;
  }
  #stage.lit { opacity: 1; }
  body.locked #stage { cursor: none; }
  #title {
    position: fixed; inset: 0; display: grid; place-content: center; text-align: center; gap: 18px;
    color: #ede9da; font: 13px/1.6 ui-monospace, monospace; letter-spacing: 0.04em;
    background: radial-gradient(ellipse at center, rgba(8, 13, 24, 0.55), rgba(8, 13, 24, 0.15) 70%);
    transition: opacity 600ms ease; pointer-events: none;
  }
  #title h1 { margin: 0; font: 600 28px/1 ui-monospace, monospace; letter-spacing: 0.18em; color: #f8ecc8; text-shadow: 2px 2px 0 #11211d; }
  #title .keys { display: grid; grid-template-columns: auto auto; gap: 2px 16px; justify-content: center; text-align: left; text-shadow: 1px 1px 0 #11211d; }
  #title .keys b { color: #f1d46a; font-weight: 600; text-align: right; }
  #title .go { color: #f1d46a; animation: pulse 1.6s ease-in-out infinite; text-shadow: 1px 1px 0 #11211d; }
  @keyframes pulse { 50% { opacity: 0.45; } }
  body.playing #title { opacity: 0; }
  #hint {
    position: fixed; right: 14px; bottom: 10px; color: #d9d6c6; opacity: 0;
    font: 11px/1 ui-monospace, monospace; transition: opacity 400ms ease; pointer-events: none;
  }
  body.ui #hint { opacity: 0.5; }

  /* --- the satchel ------------------------------------------------------------ */
  :root {
    --cell: clamp(28px, calc((100vw - 72px) / 10 - 3px), 50px);
    --ink: #ede9da; --dim: #a79d84; --gold: #e3bb4b; --gold-hi: #f1d46a;
    --leather: #2a2019; --leather-dk: #17110d; --slot: #120e0b; --slot-hi: #2a2116;
  }
  #satchel {
    position: fixed; inset: 0; display: none; z-index: 10;
    font: 12px/1.45 ui-monospace, monospace; color: var(--ink);
    background: linear-gradient(90deg, transparent 40%, rgba(8, 7, 5, 0.45));
  }
  body.satchel-open #satchel { display: block; }
  body.satchel-open #hint { opacity: 0; }
  #satchel .panel {
    position: absolute; right: max(16px, 4vw); top: 50%; transform: translateY(-50%);
    max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box;
    padding: 14px 16px 12px; cursor: default;
    background:
      radial-gradient(ellipse at 30% 0%, rgba(255, 220, 160, 0.06), transparent 60%),
      repeating-linear-gradient(35deg, rgba(0, 0, 0, 0.05) 0 2px, transparent 2px 5px),
      var(--leather);
    border: 2px solid #6b5124; outline: 2px solid var(--leather-dk);
    box-shadow: inset 0 0 0 1px #000, inset 0 0 24px rgba(0, 0, 0, 0.6), 0 12px 40px rgba(0, 0, 0, 0.6);
  }
  #satchel .title {
    margin: -2px 0 10px; text-align: center; color: var(--gold-hi);
    font: 600 15px/1 ui-monospace, monospace; letter-spacing: 0.32em; text-transform: uppercase;
    text-shadow: 1px 1px 0 #000; padding-bottom: 9px;
    border-bottom: 1px solid #6b5124; box-shadow: 0 1px 0 #000;
  }
  #satchel .label { margin: 8px 0 4px; color: var(--dim); font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; }
  #satchel .grid, #satchel .guide { display: grid; gap: 3px; }
  #satchel .grid { grid-template-columns: repeat(var(--cols), var(--cell)); }
  #satchel .guide { grid-template-columns: repeat(8, calc(var(--cell) * 0.8)); }
  #satchel .cell {
    position: relative; aspect-ratio: 1; box-sizing: border-box;
    background: var(--slot); border: 1px solid #3a2d1d;
    box-shadow: inset 1px 1px 0 #000, inset -1px -1px 0 #3d3020;
  }
  #satchel .grid .cell { cursor: pointer; }
  #satchel .grid .cell.full { background: radial-gradient(circle, #2b2a1c, var(--slot) 75%); }
  #satchel .cell:hover { border-color: var(--gold); background: var(--slot-hi); }
  #satchel .cell img, .held img, .toast img {
    display: block; width: 100%; height: 100%; image-rendering: pixelated; pointer-events: none;
  }
  #satchel .cell img { width: 80%; height: 80%; margin: 10%; }
  #satchel .guide .unknown img { filter: brightness(0); opacity: 0.45; }
  #satchel .n, .held .n {
    position: absolute; right: 3px; bottom: 1px; font-size: 11px; font-weight: 600;
    color: var(--ink); text-shadow: 1px 1px 0 #000, -1px 0 0 #000; pointer-events: none;
  }
  #satchel .foot {
    display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; padding-top: 8px;
    border-top: 1px solid #4a3a22; color: var(--dim);
  }
  #satchel .foot b { color: var(--gold-hi); font-weight: 600; }
  #satchel .foot .slots { margin-left: auto; }
  #satchel .help { margin-top: 6px; color: #7d735e; font-size: 10px; }
  #satchel .help b { color: var(--dim); font-weight: 600; }

  .held {
    position: fixed; left: 0; top: 0; z-index: 12; display: none; pointer-events: none;
    width: var(--cell); height: var(--cell); margin: calc(var(--cell) / -2) 0 0 calc(var(--cell) / -2);
    filter: drop-shadow(2px 3px 0 rgba(0, 0, 0, 0.6));
  }
  .held.on { display: block; }
  body.satchel-open:has(.held.on) #satchel { cursor: grabbing; }

  .tip {
    position: fixed; left: 0; top: 0; z-index: 11; display: none; pointer-events: none;
    max-width: 240px; padding: 8px 12px; text-align: center;
    font: 12px/1.45 ui-monospace, monospace; color: var(--ink);
    background: rgba(6, 5, 4, 0.92); border: 1px solid #4a3a22; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
  }
  .tip.on { display: block; }
  .tip .name { font-weight: 600; font-size: 13px; }
  .tip .mushroom { color: #ede9da; }
  .tip .berry { color: #8fa4f2; }
  .tip .herb { color: #8fd36a; }
  .tip .poison { color: #e8674a; }
  .tip .latin { color: var(--dim); font-style: italic; }
  .tip .kind { color: var(--gold); margin-bottom: 4px; }
  .tip .qty { color: var(--dim); }
  .tip .note { margin: 4px 0; }

  .toasts {
    position: fixed; left: 14px; bottom: 12px; z-index: 9; display: flex; flex-direction: column; gap: 4px;
    pointer-events: none; font: 12px/1 ui-monospace, monospace; color: var(--ink);
  }
  .toast {
    display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; width: max-content;
    background: rgba(10, 8, 6, 0.6); border-left: 2px solid var(--gold); text-shadow: 1px 1px 0 #000;
    animation: toast-in 200ms ease-out; transition: opacity 500ms ease;
  }
  .toast img { width: 24px; height: 24px; }
  .toast.out { opacity: 0; }
  @keyframes toast-in { from { opacity: 0; transform: translateX(-8px); } }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="title">
  <h1>INTO THE WOODS</h1>
  <div>follow the trails · forage what you find</div>
  <div class="keys">
    <b>W A S D / arrows</b><span>walk and turn</span>
    <b>Q E</b><span>step sideways</span>
    <b>R V</b><span>look up and down</span>
    <b>space</b><span>jump</span>
    <b>shift</b><span>hurry</span>
    <b>click</b><span>look with the mouse</span>
    <b>I</b><span>open your satchel</span>
    <b>F</b><span>fullscreen</span>
  </div>
  <div class="go">press any key to begin</div>
</div>
<div id="hint"></div>
<script type="module" src="./src/game/main.js"></script>
</body>
</html>
