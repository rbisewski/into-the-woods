<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forest Path</title>
<meta name="description" content="A hand-built pixel-art loop: a path through the wood, mid-morning, with sun shafts, wind and a passing cloud.">
<style>
  html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated; image-rendering: crisp-edges;
    opacity: 0; transition: opacity 900ms ease;
  }
  #stage.lit { opacity: 1; }
  #hint {
    position: fixed; right: 14px; bottom: 10px; color: #d9d6c6; opacity: 0;
    font: 11px/1 ui-monospace, monospace; transition: opacity 400ms ease; pointer-events: none;
  }
  body.ui #hint { opacity: 0.5; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="hint">space pause · f fullscreen</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
